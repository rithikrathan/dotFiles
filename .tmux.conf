set -g default-terminal "xterm-256color"
# --- 1. CORE & COLOR FIXES ---
set-option -ga terminal-overrides ",xterm-256color:Tc"
set -g mouse on
set -s escape-time 0
set -g history-limit 50000

# --- 2. THEME (Vibrant Red Rose & Grey/Black Gradient) ---
TC='#e02840' # Vibrant Red Rose (Brighter/Redder Accent)

G0='#0d0d0d' # Slight black (Darkest background)
G1='#1a1a1a' # Dark grey (For gradients and inactive tabs)
G2='#2b2b2b' # Mid grey (Left section background)
G4='#9e9e9e' # Light grey (Inactive text)

# --- 3. STATUS BAR LAYOUT ---

set -g status-position top
# set -g status-position bottom
set -g status-interval 1
set -g status-justify left
set -g status-style "bg=$G0,fg=$G4"

# Left Side: User, Session name, and fading gradient arrows
set -g status-left-length 150
set -g status-left "#[fg=$G0,bg=$TC,bold] Ra࿐  #[fg=$TC,bg=$G2,bold]#[fg=$G4,bg=$G2] ᓚᘏᗢ #S #[fg=$G2,bg=$G1,bold]#[fg=$G1,bg=$G0,bold] "

# Right Side: Time and Date (Slight black background, dotted vertical separator)
set -g status-right-length 150
set -g status-right "#[fg=$G4,bg=$G0] 󰃭 %a %d %b %y  #[fg=$G2,bg=$G0]┊  #[fg=$TC,bg=$G0,bold]⏲ %I:%M:%S %p "

# --- 4. WINDOW TABS (DIAMOND-LIKE SEGMENTS) ---
setw -g window-status-separator " "

#                             │ ┃ ┊ ┋ ┆ ┇ ⋮ ⠇ ⸾

# Enclosing tabs with  and  creates the stretched diamond/block shape
setw -g window-status-format "#[fg=$G1,bg=$G0]#[fg=$G4,bg=$G1] #I:#W #[fg=$G1,bg=$G0]"
setw -g window-status-current-format "#[fg=$TC,bg=$G0]#[fg=$G0,bg=$TC,bold] ❖ #I:#W #[fg=$TC,bg=$G0,nobold]"

# --- 5. BORDERS & INTERFACE ---
set -g pane-border-style "fg=$G2,bg=default"
set -g pane-active-border-style "fg=$TC,bg=default"
set -g message-style "fg=$G4,bg=$G1"
set -g mode-style "bg=$TC,fg=$G0" # Selection/Copy mode color

# --- 6. NAVIGATION & KEYBINDINGS ---
set -g prefix C-b
set -g base-index 1
setw -g pane-base-index 1

# # Move between panes with Alt + Arrows (No prefix needed)
# bind -n M-Left select-pane -L
# bind -n M-Right select-pane -R
# bind -n M-Up select-pane -U
# bind -n M-Down select-pane -D

# # Quick Splits
# bind | split-window -h -c "#{pane_current_path}"
# bind - split-window -v -c "#{pane_current_path}"

# Reload Config shortcut
bind r source-file ~/.tmux.conf \; display "RA THEME RELOADED!"

bind-key q kill-session

# --- TPM PLUGIN LIST ---
set -g @plugin 'tmux-plugins/tpm'

run '~/.tmux/plugins/tpm/tpm'

